name: Tests

on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Lower bound is the engines range in package.json (>=20.6).
        node-version: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Syntax check (bin, src, public)
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run tests
        run: npm test

      - name: Smoke-test packed npm install
        if: matrix.node-version == '24'
        run: |
          package_dir="$(mktemp -d)"
          npm pack --pack-destination "$package_dir"
          npm install --omit=dev --ignore-scripts --no-audit --no-fund --prefix "$package_dir/install" "$package_dir"/*.tgz
          MAILROOM_STATE_DIR="$package_dir/state" "$package_dir/install/node_modules/.bin/mailroom" --doctor

      - name: Smoke-test Compose startup
        if: matrix.node-version == '24'
        env:
          MAILROOM_PASSWORD: ci-smoke-test-password
        run: |
          sudo chown -R 1000:1000 data logs templates
          docker compose --env-file /dev/null up --build --wait --wait-timeout 90
          curl --fail --silent http://127.0.0.1:4173/api/ready

      - name: Stop Compose smoke test
        if: always() && matrix.node-version == '24'
        run: docker compose --env-file /dev/null down --volumes

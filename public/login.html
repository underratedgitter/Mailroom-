<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Mailroom</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/login.css">
</head>
<body>
  <form class="card" id="form">
    <div class="mark">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8"/>
        <path d="M8.5 11.5h15v9h-15z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
        <path d="M8.5 11.5l7.5 5.5 7.5-5.5" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <strong>Mailroom</strong>
      <span>Locked</span>
    </div>

    <h1>Sign in to this mailroom</h1>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" autofocus required>
    <button type="submit" id="submit">Sign in</button>
    <p class="error" id="error" role="alert"></p>
    <p class="foot">This install requires the password set by whoever started it.</p>
  </form>

<script src="/login.js"></script>
</body>
</html>
